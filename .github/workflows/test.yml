name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check syntax
        run: zsh -n zsh-theme.zsh

      - name: Run tests
        run: zsh -f tests/test.zsh
